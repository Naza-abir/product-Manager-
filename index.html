<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>🛍️ Product Explorer</h1>
    <p>Search, filter and save your favourite products</p>
  </header>

  <main class="container">
    <!-- Controls -->
    <section class="controls">
      <input type="text" id="searchInput" placeholder="Search products..." />

      <select id="categorySelect">
        <option value="all">All Categories</option>
      </select>

      <select id="sortSelect">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>

      <button id="favToggle" class="btn">❤️ Favourites (<span id="favCount">0</span>)</button>
    </section>

    <p id="resultInfo" class="result-info"></p>

    <!-- States -->
    <div id="loading" class="state hidden">
      <div class="spinner"></div>
      <p>Loading products...</p>
    </div>

    <div id="error" class="state error hidden">
      <p id="errorMsg">Something went wrong.</p>
      <button id="retryBtn" class="btn">Try Again</button>
    </div>

    <div id="empty" class="state hidden">
      <p>😕 No products found. Try a different search or filter.</p>
    </div>

    <!-- Product grid -->
    <section id="productGrid" class="grid"></section>
  </main>

  <!-- Details modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
